<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9E1B32" />
      <stop offset="100%" stop-color="#700D1F" />
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE0AD" />
      <stop offset="50%" stop-color="#DFBA73" />
      <stop offset="100%" stop-color="#C5A059" />
    </linearGradient>
  </defs>
  <!-- Background Circle / Squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)" />
  <circle cx="256" cy="256" r="210" fill="none" stroke="url(#gold)" stroke-width="6" opacity="0.4" stroke-dasharray="8 6" />
  
  <!-- Left Wedding Ring -->
  <ellipse cx="210" cy="256" rx="90" ry="90" fill="none" stroke="url(#gold)" stroke-width="26" />
  <!-- Right Wedding Ring Interlocked -->
  <ellipse cx="302" cy="256" rx="90" ry="90" fill="none" stroke="url(#gold)" stroke-width="26" />
  
  <!-- Diamond sparkle on right ring -->
  <polygon points="302,150 312,165 302,180 292,165" fill="#FFFFFF" />
  <circle cx="302" cy="165" r="4" fill="#FFFFFF" />

  <!-- Center Brand Name -->
  <text x="256" y="420" font-family="'Playfair Display', serif, Georgia" font-size="44" font-weight="bold" fill="url(#gold)" text-anchor="middle" letter-spacing="4">MỸ VINH</text>
</svg>
